# Mini Wolverine - Docker Compose Configuration
#
# ⚠️ IMPORTANT: File Caching Mechanism
#
# This file (docker-compose.yml) is part of the essential setup files along with
# README.md and Makefile. When cloning the repository:
#
# 1. Before cloning: If this file exists in your directory, it will be cached to
#    .setup-cache/docker-compose.yml
#
# 2. After cloning: 
#    - If docker-compose.yml exists in the cloned repository → delete cache
#      (use repository version)
#    - If docker-compose.yml is missing in the cloned repository → restore from
#      cache (keep your version)
#
# This ensures you don't lose important configuration during setup.
# See README.md for detailed setup instructions.

services:
  # Backend Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: mini-wolverine-backend-dev
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - LOG_LEVEL=info
      - CAITLYN_WS_URL=wss://116.wolverine-box.com/tm
      # ⚠️ IMPORTANT: Set your CAITLYN_TOKEN in .env file
      # The setup script creates .env file automatically
      # Edit .env file and replace 'your_caitlyn_token_here' with your actual token
      - CAITLYN_TOKEN=${CAITLYN_TOKEN}
    volumes:
      - ./backend/src:/app/src
      - ./backend/public:/app/public
      - /app/node_modules
    restart: unless-stopped
    
  # Vue Development Server
  vue-app:
    build:
      context: ./frontend-vue
      dockerfile: Dockerfile.dev
    container_name: mini-wolverine-vue-dev
    ports:
      - "3002:3002"
    environment:
      - VITE_BACKEND_WS_URL=ws://localhost:4000
    volumes:
      - ./frontend-vue/src:/app/src
      - ./frontend-vue/public:/app/public
      - /app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: unless-stopped